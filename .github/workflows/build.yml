name: Build RLXKernel_V2-cip100 (KSU Next / One UI 7)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [a10]
    steps:
      - name: Checkout upstream EurekaV2 source
        uses: actions/checkout@v4
        with:
          repository: Shaheddan/android_kernel_samsung_exynos7885
          ref: android-15
          submodules: recursive
          path: kernel

      - name: Install dependencies + clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev zlib1g-dev zstd \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 || true
          git clone --depth 1 https://github.com/Roynas-Android-Playground/kernelbuild_common.git "$RUNNER_TEMP/kbc"
          echo "PYTHONPATH=$RUNNER_TEMP/kbc" >> "$GITHUB_ENV"
          PYTHONPATH="$RUNNER_TEMP/kbc" python3 -c "import kernelbuild_common; print('IMPORT OK')"

      - name: Setup toolchain dir + branding
        working-directory: kernel
        run: |
          mkdir -p toolchain/bin
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-readelf llvm-objdump; do
            [ -e /usr/bin/$t-18 ] && ln -sf /usr/bin/$t-18 toolchain/bin/$t
          done
          [ -e /usr/bin/clang-18 ] && ln -sf /usr/bin/clang-18 toolchain/bin/clang
          toolchain/bin/clang --version
          printf '%s\n' '-RLXKernel_V2' > localversion
          printf '%s\n' '-cip100' > localversion-cip
          sed -i 's/^NAME[[:space:]]*=.*/NAME = RLXKernel V2 cip100/' Makefile
          # android-15 branch ships vendored KernelSU-Next v3.4.0-legacy
          # (CONFIG_KSU=y, manual hooks) and the One UI 7 sdcard fix.
          cat > build_kernel.py <<'PYEOF'
          from kernelbuild_common import KernelBuild, logging
          from kernelbuild_common.compiler import CompilerClang
          from argparse import ArgumentParser
          from pathlib import Path
          import os


          class EurekaKernelBuild(KernelBuild):
              def __init__(self):
                  super().__init__(
                      "RLXKernel_V2-cip100",
                      arch="arm64",
                      kernelType="Image",
                      anykernelDir=Path("AnyKernel3"),
                  )

              def initArgParser(self) -> ArgumentParser:
                  parser = super().initArgParser()
                  parser.add_argument(
                      "--target", type=str, required=True, help="Target device (a10/a20/...)"
                  )
                  parser.add_argument(
                      "--no-ksu",
                      action="store_true",
                      help="Don't include KernelSU support in kernel",
                  )
                  return parser

              def verifyArgs(self):
                  supplist = ["a10", "a20", "a20e", "a30", "a30s", "a40", "m20", "jackpotlte"]
                  if not self.args.target in supplist:
                      logging.error(
                          f"Invalid target '{self.args.target}'. Supported: {', '.join(supplist)}"
                      )
                      return False
                  return True

              def buildDefconfigList(self) -> "list[str]":
                  args = self.args
                  defconfigs = ["exynos7885_defconfig", f"{args.target}.config"]
                  if args.no_ksu:
                      defconfigs.append("noksu.config")
                  return defconfigs

              def additionalMakeArgs(self) -> "list[str]":
                  jobs = os.environ.get("BUILD_JOBS", "2")
                  return CompilerClang.ADDITIONALARGS_LLVM_FULL + [f"-j{jobs}"]

              def preBuildInfo(self) -> "dict[str, str]":
                  args = self.args
                  return {
                      "KERNEL_NAME": "RLXKernel_V2-cip100",
                      "KERNEL_CREATOR": "@rlxhype",
                      "BUILD_DATE": "2026-11-21",
                      "TARGET_DEVICE": args.target,
                      "TARGET_INCLUDES_KSU": not args.no_ksu,
                  }

              def zipName(self, name: str, time: str):
                  return f"{name}_{self.args.target}_{time}.zip"

              def anykernelFiles(self) -> "list[str]":
                  return ["version"]


          def main():
              b = EurekaKernelBuild()
              b.build()


          if __name__ == "__main__":
              main()
          PYEOF
          cat > AnyKernel3/version <<'VEREOF'
          ====================================================
                      RLXKERNEL  V2  -  CIP100
          ====================================================
           Kernel   : RLXKernel_V2-cip100
           Creator  : @rlxhype
           Build    : 2026-11-21
           Base     : android-15 / One UI 7 (Exynos 7885)
           Chipset  : Exynos 7885 / Mali G71 MP2
           Android  : OneUI & AOSP ROMs / GSIs
           Devices  : A10 / A20 / A20E / A30 / A30S / A40
           Version  : V2 - cip100
           Root     : KernelSU Next v3.4.0-legacy
           Fix      : SD force-present + generic DT2W
          ----------------------------------------------------
                      PERFORMANCE AND GAMING KERNEL
          ----------------------------------------------------
           Overclock Big to 2.29 GHz & Little to 1.79 GHz
           Underclock Big to 208 MHz & Little to 208 MHz
           Overclock GPU max freq to 1300MHz
           Balance between performance and battery life
           Upstream kernel from 4.4.177 to 4.4.302-p6
          ----------------------------------------------------
           Support  : Telegram @rlxhype
          ====================================================
          VEREOF

      - name: SD card + generic DT2W fix
        working-directory: kernel
        run: |
          cat > drivers/input/dt2w.c <<'DT2WEOF'
          /*
           * RLX generic double-tap-to-wake (panel independent).
           *
           * This is a normal input handler: it listens to every touchscreen that
           * exports BTN_TOUCH / ABS_MT_POSITION_X, so it keeps working after an
           * LCD/touch-panel replacement regardless of the touch IC in use.
           *
           * It only fires while the framebuffer is blanked (or the system is
           * suspended), so double tapping with the screen on never turns it off.
           */
          
          #include <linux/input.h>
          #include <linux/module.h>
          #include <linux/init.h>
          #include <linux/slab.h>
          #include <linux/jiffies.h>
          #include <linux/notifier.h>
          #include <linux/pm_wakeup.h>
          #include <linux/suspend.h>
          #include <linux/fb.h>
          
          struct rlx_dt2w {
          	struct input_handler handler;
          	struct input_dev *wake_dev;
          	unsigned long last_down;
          	int cur_x, cur_y;
          	int last_x, last_y;
          	bool armed;
          	bool fb_blanked;
          	bool suspended;
          };
          
          static struct rlx_dt2w *rlx_dt2w;
          
          static inline bool rlx_dt2w_screen_off(struct rlx_dt2w *d)
          {
          	return d->fb_blanked || d->suspended;
          }
          
          static void rlx_dt2w_fire(struct rlx_dt2w *d)
          {
          	/* KEY_POWER on a dedicated wakeup-enabled device resumes Android */
          	input_report_key(d->wake_dev, KEY_POWER, 1);
          	input_sync(d->wake_dev);
          	input_report_key(d->wake_dev, KEY_POWER, 0);
          	input_sync(d->wake_dev);
          	pm_wakeup_event(&d->wake_dev->dev, 1000);
          	d->armed = false;
          }
          
          static void rlx_dt2w_event(struct input_handle *handle, unsigned int type,
          			   unsigned int code, int value)
          {
          	struct rlx_dt2w *d = handle->handler->private;
          
          	if (type == EV_ABS) {
          		if (code == ABS_MT_POSITION_X || code == ABS_X)
          			d->cur_x = value;
          		else if (code == ABS_MT_POSITION_Y || code == ABS_Y)
          			d->cur_y = value;
          		return;
          	}
          
          	if (type != EV_KEY || code != BTN_TOUCH)
          		return;
          
          	if (value) { /* finger down */
          		unsigned long now = jiffies;
          		int dx = d->cur_x - d->last_x;
          		int dy = d->cur_y - d->last_y;
          
          		if (dx < 0) dx = -dx;
          		if (dy < 0) dy = -dy;
          
          		if (rlx_dt2w_screen_off(d) && d->armed &&
          		    time_before(now, d->last_down + msecs_to_jiffies(400)) &&
          		    dx < 150 && dy < 150) {
          			rlx_dt2w_fire(d);
          		} else {
          			d->armed = true;
          		}
          		d->last_down = now;
          		d->last_x = d->cur_x;
          		d->last_y = d->cur_y;
          	} else {
          		/* release: keep armed so the next press can complete the tap */
          	}
          }
          
          static int rlx_dt2w_connect(struct input_handler *handler, struct input_dev *dev,
          			    const struct input_device_id *id)
          {
          	struct input_handle *handle;
          	int error;
          
          	if (rlx_dt2w && dev == rlx_dt2w->wake_dev)
          		return -ENODEV;
          
          	handle = kzalloc(sizeof(*handle), GFP_KERNEL);
          	if (!handle)
          		return -ENOMEM;
          
          	input_handle_init(handle, dev, handler);
          	handle->name = "rlx_dt2w";
          
          	error = input_register_handle(handle);
          	if (error)
          		goto err_free;
          
          	error = input_open_device(handle);
          	if (error)
          		goto err_unregister;
          
          	return 0;
          
          err_unregister:
          	input_unregister_handle(handle);
          err_free:
          	kfree(handle);
          	return error;
          }
          
          static void rlx_dt2w_disconnect(struct input_handle *handle)
          {
          	input_close_device(handle);
          	input_unregister_handle(handle);
          	kfree(handle);
          }
          
          static const struct input_device_id rlx_dt2w_ids[] = {
          	{
          		.flags = INPUT_DEVICE_ID_MATCH_EVBIT | INPUT_DEVICE_ID_MATCH_ABSBIT,
          		.evbit = { BIT_MASK(EV_ABS) },
          		.absbit = { BIT_MASK(ABS_MT_POSITION_X) },
          	},
          	{
          		.flags = INPUT_DEVICE_ID_MATCH_EVBIT | INPUT_DEVICE_ID_MATCH_ABSBIT,
          		.evbit = { BIT_MASK(EV_ABS) },
          		.absbit = { BIT_MASK(ABS_X) },
          	},
          	{ },
          };
          MODULE_DEVICE_TABLE(input, rlx_dt2w_ids);
          
          #ifdef CONFIG_FB
          static int rlx_dt2w_fb_notifier(struct notifier_block *nb, unsigned long event,
          				void *data)
          {
          	struct fb_event *evdata = data;
          	int blank;
          
          	if (event != FB_EVENT_BLANK || !rlx_dt2w)
          		return NOTIFY_DONE;
          	if (!evdata || !evdata->data)
          		return NOTIFY_DONE;
          
          	blank = *(int *)evdata->data;
          	rlx_dt2w->fb_blanked = (blank != FB_BLANK_UNBLANK);
          	if (!rlx_dt2w->fb_blanked)
          		rlx_dt2w->armed = false;
          
          	return NOTIFY_OK;
          }
          
          static struct notifier_block rlx_dt2w_fb_nb = {
          	.notifier_call = rlx_dt2w_fb_notifier,
          };
          #endif
          
          static int rlx_dt2w_pm_notifier(struct notifier_block *nb, unsigned long event,
          				void *unused)
          {
          	if (!rlx_dt2w)
          		return NOTIFY_DONE;
          
          	switch (event) {
          	case PM_SUSPEND_PREPARE:
          		rlx_dt2w->suspended = true;
          		break;
          	case PM_POST_SUSPEND:
          		rlx_dt2w->suspended = false;
          		break;
          	default:
          		break;
          	}
          	return NOTIFY_DONE;
          }
          
          static struct notifier_block rlx_dt2w_pm_nb = {
          	.notifier_call = rlx_dt2w_pm_notifier,
          };
          
          static int __init rlx_dt2w_init(void)
          {
          	struct rlx_dt2w *d;
          	int err;
          
          	d = kzalloc(sizeof(*d), GFP_KERNEL);
          	if (!d)
          		return -ENOMEM;
          	rlx_dt2w = d;
          
          	d->wake_dev = input_allocate_device();
          	if (!d->wake_dev) {
          		err = -ENOMEM;
          		goto err_free;
          	}
          	d->wake_dev->name = "rlx_dt2w_wake";
          	d->wake_dev->phys = "rlx_dt2w/input0";
          	set_bit(EV_KEY, d->wake_dev->evbit);
          	set_bit(KEY_POWER, d->wake_dev->keybit);
          
          	err = input_register_device(d->wake_dev);
          	if (err)
          		goto err_free_dev;
          	device_init_wakeup(&d->wake_dev->dev, true);
          
          	d->handler.name = "rlx_dt2w";
          	d->handler.event = rlx_dt2w_event;
          	d->handler.connect = rlx_dt2w_connect;
          	d->handler.disconnect = rlx_dt2w_disconnect;
          	d->handler.id_table = rlx_dt2w_ids;
          	d->handler.private = d;
          
          	err = input_register_handler(&d->handler);
          	if (err)
          		goto err_unregister_dev;
          
          #ifdef CONFIG_FB
          	fb_register_client(&rlx_dt2w_fb_nb);
          #endif
          	register_pm_notifier(&rlx_dt2w_pm_nb);
          
          	pr_info("RLX DT2W: generic double-tap-to-wake loaded (all touch panels)\n");
          	return 0;
          
          err_unregister_dev:
          	input_unregister_device(d->wake_dev);
          err_free_dev:
          	input_free_device(d->wake_dev);
          err_free:
          	kfree(d);
          	rlx_dt2w = NULL;
          	return err;
          }
          
          static void __exit rlx_dt2w_exit(void)
          {
          	struct rlx_dt2w *d = rlx_dt2w;
          
          	if (!d)
          		return;
          
          	unregister_pm_notifier(&rlx_dt2w_pm_nb);
          #ifdef CONFIG_FB
          	fb_unregister_client(&rlx_dt2w_fb_nb);
          #endif
          	input_unregister_handler(&d->handler);
          	device_init_wakeup(&d->wake_dev->dev, false);
          	input_unregister_device(d->wake_dev);
          	kfree(d);
          	rlx_dt2w = NULL;
          }
          
          module_init(rlx_dt2w_init);
          module_exit(rlx_dt2w_exit);
          
          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("@rlxhype");
          MODULE_DESCRIPTION("RLX generic panel-independent double tap to wake");
          DT2WEOF
          python3 - <<'PYFIX'
          from pathlib import Path
          
          # ---------- SD card: polling + force-present fallback ----------
          p = Path('drivers/mmc/host/dw_mmc.c')
          s = p.read_text()
          
          a1 = '\tif (host->pdata->caps2)\n\t\tmmc->caps2 = host->pdata->caps2;\n'
          assert a1 in s, 'dw_mmc probe anchor missing'
          if 'MMC_CAP_NEEDS_POLL' not in s:
              s = s.replace(a1, a1 + '''\n\t/* RLX: One UI 7 port - poll removable SD slot (card-detect GPIO unreliable) */
          \tif (!(mmc->caps & MMC_CAP_NONREMOVABLE))
          \t\tmmc->caps |= MMC_CAP_NEEDS_POLL;
          ''', 1)
          
          a2 = '\tspin_lock_bh(&host->lock);\n\tif (present) {\n\t\tset_bit(DW_MMC_CARD_PRESENT, &slot->flags);\n'
          assert a2 in s, 'dw_mci_get_cd anchor missing'
          if 'RLX force card-present' not in s:
              s = s.replace(a2, '''\t/* RLX force card-present: polling slots must accept an inserted card
          \t * even when the board card-detect GPIO reports the wrong level.
          \t */
          \tif (mmc->caps & MMC_CAP_NEEDS_POLL)
          \t\tpresent = 1;
          
          ''' + a2, 1)
          p.write_text(s)
          print('SD polling + force-present: OK')
          
          # ---------- sdcardfs ----------
          d = Path('arch/arm64/configs/exynos7885_defconfig')
          c = d.read_text()
          if not any(l.strip() == 'CONFIG_SDCARD_FS=y' for l in c.splitlines()):
              c = c.rstrip('\n') + '\nCONFIG_SDCARD_FS=y\n'
              d.write_text(c)
          print('sdcardfs: OK')
          
          # ---------- generic DT2W wiring ----------
          src = Path('drivers/input/dt2w.c')
          assert src.exists(), 'dt2w.c missing'
          k = Path('drivers/input/Kconfig')
          s = k.read_text()
          if 'INPUT_RLX_DT2W' not in s:
              marker = '\nsource "drivers/input/mouse/Kconfig"\n'
              assert marker in s
              s = s.replace(marker, '''
          config INPUT_RLX_DT2W
          \tbool "RLX generic double tap to wake"
          \tdepends on INPUT && FB
          \thelp
          \t  Panel-independent double tap to wake. Works with any touch IC,
          \t  including replacement LCD/touch panels.
          ''' + marker, 1)
              k.write_text(s)
          
          m = Path('drivers/input/Makefile')
          s = m.read_text()
          if 'dt2w.o' not in s:
              marker = 'obj-$(CONFIG_INPUT_EVDEV)\t+= evdev.o\n'
              assert marker in s
              s = s.replace(marker, marker + 'obj-$(CONFIG_INPUT_RLX_DT2W)\t+= dt2w.o\n', 1)
              m.write_text(s)
          
          d = Path('arch/arm64/configs/exynos7885_defconfig')
          s = d.read_text()
          if 'CONFIG_INPUT_RLX_DT2W=y' not in s:
              s = s.rstrip('\n') + '\nCONFIG_INPUT_RLX_DT2W=y\n'
              d.write_text(s)
          print('generic DT2W wiring: OK')
          PYFIX
          grep -n 'RLX force card-present' drivers/mmc/host/dw_mmc.c
          grep -n 'NEEDS_POLL' drivers/mmc/host/dw_mmc.c
          grep -n 'INPUT_RLX_DT2W' arch/arm64/configs/exynos7885_defconfig

      - name: Build ${{ matrix.target }} (KSU)
        working-directory: kernel
        env:
          BUILD_JOBS: 2
        run: python3 build_kernel.py --target ${{ matrix.target }} --show-output

      - name: Verify KSU
        working-directory: kernel
        run: grep -q 'CONFIG_KSU=y' out/.config && echo 'KSU OK'

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: RLXKernel_V2-cip100_KSU_${{ matrix.target }}
          path: kernel/RLXKernel_V2-cip100_${{ matrix.target }}_*.zip
          if-no-files-found: error
