name: Build RLXKernel_V2-cip100 (KernelSU)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [a10]
    steps:
      - name: Checkout upstream EurekaV2 source
        uses: actions/checkout@v4
        with:
          repository: Shaheddan/android_kernel_samsung_exynos7885
          ref: EurekaV2
          submodules: recursive
          path: kernel

      - name: Install dependencies + clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev zlib1g-dev zstd \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 || true
          git clone --depth 1 https://github.com/Roynas-Android-Playground/kernelbuild_common.git "$RUNNER_TEMP/kbc"
          echo "PYTHONPATH=$RUNNER_TEMP/kbc" >> "$GITHUB_ENV"
          PYTHONPATH="$RUNNER_TEMP/kbc" python3 -c "import kernelbuild_common; print('IMPORT OK')"

      - name: Setup toolchain dir + branding
        working-directory: kernel
        run: |
          mkdir -p toolchain/bin
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-readelf llvm-objdump; do
            [ -e /usr/bin/$t-18 ] && ln -sf /usr/bin/$t-18 toolchain/bin/$t
          done
          [ -e /usr/bin/clang-18 ] && ln -sf /usr/bin/clang-18 toolchain/bin/clang
          toolchain/bin/clang --version
          printf '%s\n' '-RLXKernel_V2' > localversion
          printf '%s\n' '-cip100' > localversion-cip
          sed -i 's/^NAME[[:space:]]*=.*/NAME = RLXKernel V2 cip100/' Makefile
          grep -q '^CONFIG_KPROBES=y' arch/arm64/configs/exynos7885_defconfig || \
            printf '\nCONFIG_KPROBES=y\n' >> arch/arm64/configs/exynos7885_defconfig
          cat > build_kernel.py <<'PYEOF'
          from kernelbuild_common import KernelBuild, logging
          from kernelbuild_common.compiler import CompilerClang
          from argparse import ArgumentParser
          from pathlib import Path
          import os


          class EurekaKernelBuild(KernelBuild):
              def __init__(self):
                  super().__init__(
                      "RLXKernel_V2-cip100",
                      arch="arm64",
                      kernelType="Image",
                      anykernelDir=Path("AnyKernel3"),
                  )

              def initArgParser(self) -> ArgumentParser:
                  parser = super().initArgParser()
                  parser.add_argument(
                      "--target", type=str, required=True, help="Target device (a10/a20/...)"
                  )
                  parser.add_argument(
                      "--no-ksu",
                      action="store_true",
                      help="Don't include KernelSU support in kernel",
                  )
                  return parser

              def verifyArgs(self):
                  supplist = ["a10", "a20", "a20e", "a30", "a30s", "a40", "m20", "jackpotlte"]
                  if not self.args.target in supplist:
                      logging.error(
                          f"Invalid target '{self.args.target}'. Supported: {', '.join(supplist)}"
                      )
                      return False
                  return True

              def buildDefconfigList(self) -> "list[str]":
                  args = self.args
                  defconfigs = ["exynos7885_defconfig", f"{args.target}.config"]
                  if args.no_ksu:
                      defconfigs.append("noksu.config")
                  return defconfigs

              def additionalMakeArgs(self) -> "list[str]":
                  jobs = os.environ.get("BUILD_JOBS", "2")
                  return CompilerClang.ADDITIONALARGS_LLVM_FULL + [f"-j{jobs}"]

              def preBuildInfo(self) -> "dict[str, str]":
                  args = self.args
                  return {
                      "KERNEL_NAME": "RLXKernel_V2-cip100",
                      "KERNEL_CREATOR": "@rlxhype",
                      "BUILD_DATE": "2026-11-21",
                      "TARGET_DEVICE": args.target,
                      "TARGET_INCLUDES_KSU": not args.no_ksu,
                  }

              def zipName(self, name: str, time: str):
                  return f"{name}_{self.args.target}_{time}.zip"

              def anykernelFiles(self) -> "list[str]":
                  return ["version"]


          def main():
              b = EurekaKernelBuild()
              b.build()


          if __name__ == "__main__":
              main()
          PYEOF
          cat > AnyKernel3/version <<'VEREOF'
          ====================================================
                      RLXKERNEL  V2  -  CIP100
          ====================================================
           Kernel   : RLXKernel_V2-cip100
           Creator  : @rlxhype
           Build    : 2026-11-21
           Base     : EurekaV2 / One UI 7 (Exynos 7885)
           Chipset  : Exynos 7885 / Mali G71 MP2
           Android  : OneUI & AOSP ROMs / GSIs
           Devices  : A10 / A20 / A20E / A30 / A30S / A40
           Version  : V2 - cip100
           Root     : KernelSU Next v3.4.0-legacy
           Fix      : SD force-present + generic DT2W
          ----------------------------------------------------
                      PERFORMANCE AND GAMING KERNEL
          ----------------------------------------------------
           Overclock Big to 2.29 GHz & Little to 1.79 GHz
           Underclock Big to 208 MHz & Little to 208 MHz
           Overclock GPU max freq to 1300MHz
           Balance between performance and battery life
           Upstream kernel from 4.4.177 to 4.4.302-p6
          ----------------------------------------------------
           Support  : Telegram @rlxhype
          ====================================================
          VEREOF

      - name: SD card fix (SDFAT owns vfat/exfat mounts)
        working-directory: kernel
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          d = Path('arch/arm64/configs/exynos7885_defconfig')
          c = d.read_text()
          # Stock/Equinox behaviour: sdFAT registers the "vfat" filesystem.
          # CONFIG_VFAT_FS=y blocks SDFAT_USE_FOR_VFAT, so external SD never mounts.
          if 'CONFIG_VFAT_FS=y' in c:
              c = c.replace('CONFIG_VFAT_FS=y', '# CONFIG_VFAT_FS is not set')
          for opt in ['CONFIG_SDFAT_FS=y', 'CONFIG_SDFAT_USE_FOR_VFAT=y',
                      'CONFIG_SDFAT_USE_FOR_EXFAT=y']:
              if not any(l.strip() == opt for l in c.splitlines()):
                  c = c.rstrip('\n') + '\n' + opt + '\n'
          d.write_text(c)
          print('SDFAT vfat/exfat registration: OK')
          PYFIX
          grep -nE 'VFAT_FS|SDFAT_FS|SDFAT_USE_FOR' arch/arm64/configs/exynos7885_defconfig

      - name: Build ${{ matrix.target }} (KSU)
        working-directory: kernel
        env:
          BUILD_JOBS: 2
        run: python3 build_kernel.py --target ${{ matrix.target }} --show-output

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: RLXKernel_V2-cip100_KSU_${{ matrix.target }}
          path: kernel/RLXKernel_V2-cip100_${{ matrix.target }}_*.zip
          if-no-files-found: error
